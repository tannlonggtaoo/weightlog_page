<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9f6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141c19">
  <title>Weightlog · 体重、饮食与运动手记</title>
  <link rel="stylesheet" href="./style.css?v=3">
  <script type="module" src="./app.js?v=4"></script>
</head>
<body>
  <header class="topbar">
    <div class="bar-inner">
      <div class="brand" aria-label="Weightlog">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Weightlog
      </div>
      <nav id="navigation" aria-label="主导航" hidden>
        <button type="button" data-view="entry">记一笔</button>
        <button type="button" data-view="overview">总览</button>
      </nav>
      <button type="button" class="quiet" id="settings" hidden>设置</button>
    </div>
  </header>

  <main>
    <noscript>请启用 JavaScript 以记录体重、饮食与运动。</noscript>
    <section id="auth" class="auth-view" aria-labelledby="auth-title" hidden>
      <div class="settings-heading">
        <h1 id="auth-title">设置</h1>
        <button type="button" id="auth-back" class="quiet" hidden>返回</button>
      </div>
      <p class="intro">凭证和个人资料保存在此浏览器中。</p>
      <div class="settings-list">
        <form id="auth-form" class="card form-card" aria-labelledby="github-settings-title">
          <h2 id="github-settings-title">GitHub 仓库</h2>
          <p class="hint">记录保存到 <strong id="repo-name"></strong>。</p>
          <label for="token-input">个人访问令牌（PAT）</label>
          <input id="token-input" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <div class="form-actions">
            <button class="primary" type="submit">保存令牌</button>
            <button type="button" id="forget" class="danger" hidden>清除令牌</button>
          </div>
          <p class="message" id="auth-message" role="status"></p>
        </form>
        <form id="openrouter-form" class="card form-card" aria-labelledby="openrouter-settings-title">
          <h2 id="openrouter-settings-title">OpenRouter</h2>
          <label for="openrouter-key-input">API Key</label>
          <input id="openrouter-key-input" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <p class="hint">点「估算」时，当前记录的描述和照片会发送给 OpenRouter。</p>
          <div class="form-actions">
            <button class="primary" type="submit">保存 Key</button>
            <button type="button" id="forget-openrouter" class="danger" hidden>清除 Key</button>
          </div>
          <p class="message" id="openrouter-message" role="status"></p>
        </form>
        <form id="profile-form" class="card form-card" aria-labelledby="profile-title">
          <h2 id="profile-title">个人资料</h2>
          <div class="profile-fields">
            <div>
              <label for="birth-year-input">出生年份</label>
              <input id="birth-year-input" type="number" inputmode="numeric" min="1" step="1">
            </div>
            <div>
              <label for="height-input">身高（cm）</label>
              <input id="height-input" type="number" inputmode="decimal" min="0" step="any">
            </div>
          </div>
          <div class="form-actions">
            <button class="primary" type="submit">保存资料</button>
          </div>
          <p class="message" id="profile-message" role="status"></p>
        </form>
      </div>
    </section>

    <section id="entry" aria-labelledby="entry-title" hidden>
      <h1 id="entry-title">记一笔</h1>
      <p class="intro" id="entry-date"></p>
      <form id="entry-form" class="card form-card">
        <div class="switcher" role="group" aria-label="记录类别">
          <button type="button" data-kind="weight" aria-pressed="true">体重</button>
          <button type="button" data-kind="food" aria-pressed="false">饮食</button>
          <button type="button" data-kind="exercise" aria-pressed="false">运动</button>
        </div>
        <div id="weight-field" class="value-field">
          <label for="weight-input">体重</label>
          <div class="weight-box">
            <input id="weight-input" type="number" inputmode="decimal" step="any" min="0" placeholder="0.0" required>
            <span>kg</span>
          </div>
        </div>
        <div id="food-field" class="value-field" hidden>
          <label for="food-input">吃了什么？</label>
          <textarea id="food-input" rows="3" placeholder="写下这餐吃了什么，也可以只拍一张照片" disabled></textarea>
          <div class="photo-actions">
            <label class="photo-picker" for="camera-input">
              拍照
              <input id="camera-input" type="file" accept="image/*" capture="environment">
            </label>
            <label class="photo-picker" for="album-input">
              选照片
              <input id="album-input" type="file" accept="image/*">
            </label>
            <button type="button" class="quiet" id="remove-photo" hidden>移除照片</button>
          </div>
          <div id="photo-preview"></div>
        </div>
        <div id="exercise-field" class="value-field" hidden>
          <label for="exercise-input">做了什么运动？</label>
          <textarea id="exercise-input" rows="3" placeholder="例如慢跑 30 分钟" required disabled></textarea>
        </div>
        <div id="calorie-field" class="value-field" hidden>
          <label id="calorie-label" for="calorie-input">热量（选填）</label>
          <div class="calorie-row">
            <input id="calorie-input" type="number" inputmode="decimal" min="0" step="any" aria-describedby="calorie-unit" disabled>
            <span class="hint" id="calorie-unit">kcal</span>
            <button type="button" class="quiet" id="estimate-calories">估算</button>
          </div>
          <p class="hint message" id="estimate-message" role="status"></p>
        </div>
        <div class="time-row">
          <label for="time-input">记录时间</label>
          <span id="auto-time">现在</span>
          <button id="toggle-time" class="quiet" type="button" aria-controls="time-input" aria-expanded="false">修改时间</button>
        </div>
        <input id="time-input" type="datetime-local" disabled hidden required>
        <button class="primary" id="save" type="submit">保存记录</button>
        <button id="cancel-edit" class="quiet cancel-edit" type="button" hidden>取消修改</button>
        <p id="entry-error" class="message error" role="alert"></p>
      </form>
      <div id="receipt" class="receipt" role="status" hidden>
        <span id="receipt-text"></span>
        <button id="edit-last" class="quiet" type="button">修改</button>
      </div>
    </section>

    <section id="overview" aria-labelledby="overview-title" hidden>
      <h1 id="overview-title">总览</h1>
      <p class="intro">体重趋势与每日记录</p>
      <p id="overview-message" class="message" role="status"></p>
      <button type="button" class="quiet" id="retry" hidden>重新读取</button>
      <div id="overview-content" hidden>
        <div class="card summary-card">
          <div class="summary-head">
            <div>
              <h2 class="small-title">最近一次体重</h2>
              <div class="reading"><strong id="latest-kg">—</strong><span>kg</span></div>
              <p class="hint" id="latest-at"></p>
            </div>
            <span class="range">近 30 天趋势</span>
          </div>
          <canvas id="trend" aria-label="近 30 天体重趋势，测量详情见下方每日记录"></canvas>
          <p class="hint chart-caption" id="chart-caption" aria-live="polite"></p>
        </div>
        <div class="history-head"><h2>每日记录</h2><span class="hint" id="entry-count"></span></div>
        <div id="history"></div>
      </div>
    </section>
  </main>

  <template id="record-row">
    <li class="record-row">
      <div class="row-meta"><time></time><span class="kind-label"></span></div>
      <div class="row-content">
        <p class="row-value"></p>
        <p class="row-calories hint" hidden></p>
      </div>
      <div class="row-actions">
        <button type="button" class="quiet" data-action="edit">修改</button>
        <button type="button" class="danger" data-action="delete">删除</button>
      </div>
    </li>
  </template>
  <template id="photo-thumbnail">
    <button type="button" class="photo-thumb" aria-label="查看饮食照片">
      <img alt="饮食照片" hidden>
      <span>照片</span>
    </button>
  </template>
  <dialog id="photo-viewer" aria-label="饮食照片">
    <img alt="饮食照片大图">
    <form method="dialog"><button type="submit" class="quiet" autofocus>关闭</button></form>
  </dialog>
</body>
</html>
